<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Armis MML 변환기</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --bg:#0b0d10; --panel:#131720; --text:#dde3ea; --muted:#9aa6b2;
    --line:#1f2430; --chip:#1a2130; --accent:#63b3ed;
    --ok:#9fe3b4; --warn:#ffd580; --bad:#ff9aa2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif}
  header{padding:28px 16px;text-align:center}
  h1{margin:0;font-size:24px}
  .subtitle{color:var(--muted);margin-top:6px;font-size:14px}
  main{max-width:980px;margin:0 auto;padding:0 16px 64px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}
  .uploader{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  input[type=file]{padding:10px;border:1px dashed var(--line);border-radius:10px;background:#0f1420;color:var(--text)}
  select{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#0f1420;color:var(--text);font-size:13px}
  label.opt{display:inline-flex;gap:6px;align-items:center;color:var(--muted);font-size:12px}
  .hint{color:var(--muted);font-size:12px}
  .track{background:#0f1420;border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
  .row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;
    border-bottom:1px dashed var(--line);padding-bottom:8px;margin-bottom:8px}
  .badge{display:inline-flex;gap:8px;align-items:center;background:var(--chip);
    border-radius:999px;padding:4px 10px;color:var(--accent);font-size:12px}
  .meta{color:var(--muted);font-size:12px}
  .left{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .arrow{color:var(--muted);font-size:12px}
  select.inst{padding:4px 8px;border-radius:8px;border:1px solid var(--line);
    background:#0f1420;color:var(--text);font-size:12px}
  textarea{width:100%;min-height:140px;resize:vertical;background:#0c111c;color:var(--text);
    border:1px solid var(--line);border-radius:8px;padding:10px;
    font-family:ui-monospace,Consolas,Menlo,monospace;font-size:13px;line-height:1.5}
  button{padding:7px 12px;border-radius:8px;border:1px solid var(--line);
    background:var(--chip);color:var(--text);cursor:pointer;font-size:13px}
  button:hover{filter:brightness(1.15)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .copy{color:var(--ok)}
  .loading{display:none;color:var(--muted);font-size:12px}
  .error{color:var(--bad);white-space:pre-wrap;margin-top:8px}
  .warning{color:var(--warn);font-size:12px;margin-top:8px;white-space:pre-wrap}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .empty{color:var(--muted);font-size:13px}
</style>
</head>
<body>

<header>
  <h1>Armis MML 변환기</h1>
  <p class="subtitle">MIDI 파일을 올리면 트랙·채널별 MML을 만듭니다.</p>
</header>

<main>
  <section class="panel">
    <div class="uploader">
      <input id="file" type="file" accept=".mid,.midi" />
      <label class="opt">양자화
        <select id="quantize">
          <option value="hybrid" selected>하이브리드 (2분할+셋잇단)</option>
          <option value="binary">2분할만 (1/32)</option>
          <option value="none">끄기 (원본 그대로)</option>
        </select>
      </label>
      <label class="opt">
        <input id="technique" type="checkbox" checked /> 기법 자동 적용
      </label>
      <span id="ppq" class="hint"></span>
      <span id="loading" class="loading">변환 중…</span>
    </div>
    <div id="err" class="error"></div>
    <div id="warning" class="warning"></div>
  </section>

  <section class="panel">
    <div class="toolbar">
      <h3 style="margin:0 8px 0 0;flex:1">결과</h3>
      <button id="copyAll">전체 복사</button>
      <button id="download">.txt로 저장</button>
    </div>
    <div id="tracks"><p class="empty">아직 변환한 파일이 없습니다.</p></div>
  </section>
</main>

<script>
/* ============================================================
   설정
   ============================================================
   내부 해상도를 tick 단위로 다룬다. (MabiIcco의 MMLTickTable.TPQN 방식)

   TPQN = 96  →  4분음표 96 tick, 온음표 384 tick.
   이 값에서는 2분할과 3분할이 모두 정수로 떨어진다.
     1/32 = 12,  1/64 = 6
     8분 셋잇단(l12) = 32,  16분 셋잇단(l24) = 16,  32분 셋잇단(l48) = 8
   예전처럼 "1/32 격자에 반올림"하지 않으므로 셋잇단이 깨지지 않는다.
   ============================================================ */
const TPQN  = 96;
const WHOLE = TPQN * 4;   // 온음표 tick

/* Armis가 받아들이는 음표 길이 토큰. (게임에서 동작 확인 완료)
   게임이 특정 값을 거부하면 여기서 빼기만 하면 된다.
   3/6/12/24/48 이 셋잇단음표용.
   (MabiIcco의 tickInvTableForMb 구성 + 2분음표 셋잇단 "3")

   TPQN 96에서 정수 tick으로 떨어지는 분모만 쓸 수 있다.
   1,2,3,4,6,8,12,16,24,32,48,64 이 그 목록이고,
   5나 7 같은 값은 tick이 나누어떨어지지 않아 넣어도 무시된다. */
const LENGTH_TOKENS = ["1","1.","2","2.","3","4","4.","8","8.","16","16.","32","32.","64","64.","6","12","24","48"];

/* 한 음을 최대 몇 개 토큰까지 &로 이어붙일지 (MabiIcco COMBN) */
const COMBN = 3;

/* 양자화 방식
   "hybrid" : 2분할 격자와 3분할 격자 중 가까운 쪽으로 스냅 → 셋잇단 보존
   "binary" : 2분할 격자만
   "none"   : 스냅하지 않고 원본 tick 그대로 (연주 데이터의 흔들림까지 그대로) */
let QUANTIZE_MODE = "hybrid";
const BINARY_GRID  = WHOLE / 32;   // 12 tick = 1/32음표
const TRIPLET_GRID = WHOLE / 24;   // 16 tick = 1/24음표(16분 셋잇단)

/* 화음 구성음의 길이를 맞추는 방식.
   "min"  : 가장 짧은 음에 맞춤 (원본 note-off보다 길어지지 않음)
   "max"  : 가장 긴 음에 맞춤 (울림 유지, 다음 음과 겹칠 수 있음)
   "first": 가장 낮은 음의 길이 사용 */
const CHORD_DURATION_MODE = "min";

/* 음량. Armis의 v는 6 미만이면 소리가 나지 않으므로 6~15만 쓴다.
   MIDI velocity 1~127을 이 구간에 그대로 펼쳐 대응시킨다. */
const VEL_MIN = 6;
const VEL_MAX = 15;
const AUTO_BOOT_VELOCITY = true;   // 곡 전체 최대 velocity를 15로 끌어올림
const INITIAL_TEMPO = 120;

/* ============================================================
   연주 기법
   ============================================================
   Armis 표기법
     *N  → 음표 "뒤"에 붙는다.  예) c4*13
     [N] → 음표 "앞"에 붙는다.  예) [1]c4
   ============================================================ */
const TECHNIQUE = {
  up:       { code: "*8",  place: "post", label: "상" },
  down:     { code: "*9",  place: "post", label: "하" },
  staccato: { code: "*13", place: "post", label: "스타카토" },
  accent:   { code: "*14", place: "post", label: "악센트" },
  vibrato:  { code: "[1]", place: "pre",  label: "비브라토" },
  fermata:  { code: "[2]", place: "pre",  label: "페르마타" }
};

/* MIDI에서 자동으로 뽑아낼 수 있는 기법만 켠다.
   상/하, 페르마타는 MIDI 데이터만으로 판단할 근거가 없어 자동 적용하지 않는다. */
let AUTO_TECHNIQUE = true;

/* 스타카토: 실제 발음 길이가 그 자리(다음 음까지의 간격)의 이 비율 이하일 때 */
const STACCATO_RATIO = 0.55;

/* 악센트: 주변 음들의 평균 음량보다 이만큼(v 단위) 큰 음 */
const ACCENT_DELTA = 3;
const ACCENT_WINDOW = 8;   // 평균을 낼 앞뒤 음 개수

/* 악센트를 붙인 음의 v를 어떻게 할지.
   "replace" : v를 주변 평균으로 되돌린다. 강조는 *14가 담당 (이중으로 커지지 않음)
   "keep"    : 원래 v를 그대로 두고 *14도 붙인다 (아주 강한 강조) */
const ACCENT_MODE = "replace";

/* 비브라토: 모듈레이션(CC1)이 이 값 이상으로 걸린 구간의 음 */
const VIBRATO_CC_MIN = 40;

/* ============================================================
   악기 맵 (General MIDI)
   ============================================================ */
const INSTRUMENT_MAP = ["acoustic grand piano","bright acoustic piano","electric grand piano","honky-tonk piano","electric piano 1","electric piano 2","harpsichord","clavi","celesta","glockenspiel","music box","vibraphone","marimba","xylophone","tubular bells","dulcimer","drawbar organ","percussive organ","rock organ","church organ","reed organ","accordion","harmonica","tango accordion","acoustic guitar (nylon)","acoustic guitar (steel)","electric guitar (jazz)","electric guitar (clean)","electric guitar (muted)","overdriven guitar","distortion guitar","guitar harmonics","acoustic bass","electric bass (finger)","electric bass (pick)","fretless bass","slap bass 1","slap bass 2","synth bass 1","synth bass 2","violin","viola","cello","contrabass","tremolo strings","pizzicato strings","orchestral harp","timpani","string ensemble 1","string ensemble 2","synthstrings 1","synthstrings 2","choir aahs","voice oohs","synth voice","orchestra hit","trumpet","trombone","tuba","muted trumpet","french horn","brass section","synthbrass 1","synthbrass 2","soprano sax","alto sax","tenor sax","baritone sax","oboe","english horn","bassoon","clarinet","piccolo","flute","recorder","pan flute","blown bottle","shakuhachi","whistle","ocarina","lead 1 (square)","lead 2 (sawtooth)","lead 3 (calliope)","lead 4 (chiff)","lead 5 (charang)","lead 6 (voice)","lead 7 (fifths)","lead 8 (bass + lead)","pad 1 (new age)","pad 2 (warm)","pad 3 (polysynth)","pad 4 (choir)","pad 5 (bowed)","pad 6 (metallic)","pad 7 (halo)","pad 8 (sweep)","fx 1 (rain)","fx 2 (soundtrack)","fx 3 (crystal)","fx 4 (atmosphere)","fx 5 (brightness)","fx 6 (goblins)","fx 7 (echoes)","fx 8 (sci-fi)","sitar","banjo","shamisen","koto","kalimba","bag pipe","fiddle","shanai","tinkle bell","agogo","steel drums","woodblock","taiko drum","melodic tom","synth drum","reverse cymbal","guitar fret noise","breath noise","seashore","bird tweet","telephone ring","helicopter","applause","gunshot"];

const PITCH_CLASS = ["c","c+","d","d+","e","f","f+","g","g+","a","a+","b"];
const REST = "r";

/* 게임에서 고를 수 있는 악기.
   지금은 화면에서 고르기만 하고 변환 결과에는 반영하지 않는다. */
const ARMIS_INSTRUMENTS = ["피아노","북","고쟁","퉁소","바이올린","기타","비파","이호","피리","드럼","베이스","신디사이저","태평소"];

/* ============================================================
   tick 테이블 (모듈 로드 시 1회 생성)
   ============================================================
   MabiIcco MMLTickTable.generateInvTable 이식.
   토큰 1~COMBN개를 더해서 만들 수 있는 모든 tick 길이를 미리 만들어 두고,
   가장 짧게 표기되는 조합을 정답으로 저장한다.
   덕분에 "tick 길이 → MML"이 반올림 없이 정확히 떨어진다.
   ============================================================ */
function tokenTick(token) {
  const dot = token.endsWith(".");
  const n = parseInt(dot ? token.slice(0, -1) : token, 10);
  if (!n) return 0;
  let t = WHOLE / n;
  if (!Number.isInteger(t)) return 0;
  if (dot) {
    if (t % 2 !== 0) return 0;
    t += t / 2;
  }
  return t;
}

const TOKENS = LENGTH_TOKENS
  .map(name => ({ name, tick: tokenTick(name) }))
  .filter(x => x.tick > 0)
  .sort((a, b) => b.tick - a.tick);

const MIN_TICK = Math.min(...TOKENS.map(t => t.tick));   // 표현 가능한 최소 길이

const TICK_TABLE = (() => {
  const map = new Map();
  // MabiIcco patternLength와 같은 취지: 토큰 수가 적고 짧게 찍히는 쪽이 이긴다
  const cost = list => list.reduce((s, n) => s + n.length, 0) + list.length * 10;
  const limit = WHOLE * 2;

  const walk = (from, chosen, total) => {
    if (chosen.length) {
      const cur = map.get(total);
      if (!cur || cost(chosen) < cost(cur)) map.set(total, chosen.slice());
    }
    if (chosen.length >= COMBN) return;
    for (let i = from; i < TOKENS.length; i++) {
      const next = total + TOKENS[i].tick;
      if (next > limit) continue;
      chosen.push(TOKENS[i].name);
      walk(i, chosen, next);
      chosen.pop();
    }
  };
  walk(0, [], 0);
  return map;
})();

const TICK_KEYS = [...TICK_TABLE.keys()].sort((a, b) => a - b);

/* 주어진 값 이하 중 표현 가능한 가장 큰 tick */
function largestFitting(tick) {
  let lo = 0, hi = TICK_KEYS.length - 1, best = 0;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (TICK_KEYS[mid] <= tick) { best = TICK_KEYS[mid]; lo = mid + 1; }
    else hi = mid - 1;
  }
  return best;
}

/* tick 길이 → MML 문자열.
   반환값의 tick은 "실제로 찍힌 길이"다. 요청 길이와 다를 수 있으므로
   커서 계산에는 반드시 이 값을 쓴다. (박자 밀림 방지의 핵심)
   tie=false 이면 &로 잇지 않는다. 쉼표는 tie를 쓰면 안 되므로 false.
   (MabiIcco MMLTicks의 needTie와 동일) */
function ticksToMml(name, tick, tie) {
  let rem = Math.max(0, Math.round(tick));
  const out = [];
  let used = 0;

  // 아주 긴 음: "1."을 반복해서 줄인다 (MMLTicks.toMMLText)
  const dottedWhole = tokenTick("1.");
  while (rem > WHOLE * 2) { out.push("1."); rem -= dottedWhole; used += dottedWhole; }

  while (rem >= MIN_TICK) {
    const exact = TICK_TABLE.get(rem);
    if (exact) { out.push(...exact); used += rem; rem = 0; break; }
    const fit = largestFitting(rem);
    if (!fit) break;
    out.push(...TICK_TABLE.get(fit));
    used += fit;
    rem -= fit;
  }

  return { text: out.map(t => name + t).join(tie ? "&" : ""), tick: used };
}

/* ============================================================
   변환 유틸
   ============================================================ */
/* 원본 tick → 내부 TPQN tick (MabiIcco MidiFile.convTick) */
function toTick(tick, ppq) {
  if (!isFinite(ppq) || ppq <= 0) return 0;
  return Math.round((tick * TPQN) / ppq);
}

/* 격자 스냅. 2분할·3분할 중 가까운 쪽을 고르므로 셋잇단이 살아남는다. */
function snap(tick) {
  if (QUANTIZE_MODE === "none") return tick;
  const b = Math.round(tick / BINARY_GRID) * BINARY_GRID;
  if (QUANTIZE_MODE === "binary") return b;
  const t = Math.round(tick / TRIPLET_GRID) * TRIPLET_GRID;
  return Math.abs(tick - b) <= Math.abs(tick - t) ? b : t;
}

function keyToPitchClass(k) { return PITCH_CLASS[((k % 12) + 12) % 12]; }
function keyToOctave(k) { return k < 12 ? 0 : Math.trunc(k / 12) - 1; }
function velocityToMml(v) {
  const val = Math.trunc((v * (VEL_MAX - VEL_MIN)) / 127) + VEL_MIN;
  return Math.max(VEL_MIN, Math.min(VEL_MAX, val));
}
function microsToBpm(micros) {
  if (!isFinite(micros) || micros <= 0) return INITIAL_TEMPO;
  return Math.max(1, Math.min(1000, Math.round(60000000 / micros)));
}

/* ============================================================
   SMF 파서
   ============================================================ */
function readU32(b, i) { return ((b[i] << 24) | (b[i+1] << 16) | (b[i+2] << 8) | b[i+3]) >>> 0; }
function readU16(b, i) { return ((b[i] << 8) | b[i+1]) >>> 0; }

function readVar(b, i) {
  let value = 0, pos = i, byte;
  do {
    if (pos >= b.length) throw new Error("MIDI 가변길이 값이 잘렸습니다.");
    byte = b[pos++];
    value = (value << 7) | (byte & 0x7f);
  } while (byte & 0x80);
  return { value, next: pos };
}

function parseSMF(buffer) {
  const b = new Uint8Array(buffer);
  let i = 0;

  function chunk() {
    if (i + 8 > b.length) throw new Error("MIDI 청크가 손상되었습니다.");
    const id = String.fromCharCode(b[i], b[i+1], b[i+2], b[i+3]);
    i += 4;
    const len = readU32(b, i);
    i += 4;
    if (i + len > b.length) throw new Error("MIDI 청크 길이가 파일 크기를 넘습니다.");
    const data = b.slice(i, i + len);
    i += len;
    return { id, data };
  }

  const head = chunk();
  if (head.id !== "MThd") throw new Error("MIDI 헤더(MThd)를 찾지 못했습니다.");
  if (head.data.length < 6) throw new Error("MIDI 헤더가 너무 짧습니다.");

  const format = readU16(head.data, 0);
  const ntrks  = readU16(head.data, 2);
  const division = readU16(head.data, 4);

  if ((division & 0x8000) !== 0) {
    throw new Error("SMPTE 기준 MIDI는 지원하지 않습니다. PPQ 기준 파일로 저장한 뒤 다시 올려주세요.");
  }
  const ppq = division & 0x7fff;
  if (ppq <= 0) throw new Error("PPQ 값이 올바르지 않습니다.");

  const tracks = [];
  for (let t = 0; t < ntrks && i < b.length; t++) {
    const c = chunk();
    if (c.id !== "MTrk") continue;

    const d = c.data;
    let pos = 0, tick = 0, running = null;
    const events = [];

    while (pos < d.length) {
      const delta = readVar(d, pos);
      pos = delta.next;
      tick += delta.value;
      if (pos >= d.length) break;

      const status = d[pos];
      if (status < 0x80) {
        if (running === null) throw new Error("running status 없이 데이터 바이트가 나왔습니다.");
      } else {
        pos++;
        running = status;
      }

      // 메타 이벤트
      if (running === 0xFF) {
        if (pos >= d.length) break;
        const metaType = d[pos++];
        const len = readVar(d, pos);
        pos = len.next;
        const payload = d.slice(pos, pos + len.value);
        pos += len.value;
        if (metaType === 0x51 && payload.length === 3) {
          const micros = (payload[0] << 16) | (payload[1] << 8) | payload[2];
          events.push({ tick, type: "tempo", bpm: microsToBpm(micros) });
        }
        running = null;      // 메타는 running status를 취소한다
        if (metaType === 0x2F) break;
        continue;
      }

      // SysEx
      if (running === 0xF0 || running === 0xF7) {
        const len = readVar(d, pos);
        pos = len.next + len.value;
        running = null;      // SysEx도 running status를 취소한다
        continue;
      }

      const hi = running & 0xF0;
      const ch = running & 0x0F;

      if (hi === 0x90 || hi === 0x80) {
        if (pos + 2 > d.length) break;
        const key = d[pos++], vel = d[pos++];
        const isOn = (hi === 0x90 && vel > 0);
        events.push({ tick, type: isOn ? "on" : "off", ch, key, vel });
      } else if (hi === 0xC0) {
        if (pos + 1 > d.length) break;
        events.push({ tick, type: "program", ch, program: d[pos++] });
      } else if (hi === 0xB0) {
        if (pos + 2 > d.length) break;
        const cc = d[pos++], value = d[pos++];
        if (cc === 1) events.push({ tick, type: "mod", ch, value });   // 비브라토 판정용
      } else if (hi === 0xA0 || hi === 0xE0) {
        pos += 2;
      } else if (hi === 0xD0) {
        pos += 1;
      }
    }
    tracks.push(events);
  }

  return { format, ppq, tracks };
}

/* ============================================================
   노트 추출 — (트랙, 채널)별로 분리
   ============================================================ */
function collectParts(smf) {
  const parts = new Map();   // "trackIndex:channel" -> part
  const tempos = [];         // {tick, bpm}
  let endTick = 0;

  smf.tracks.forEach((events, trackIndex) => {
    const holding = new Map();  // "ch:key" -> [note, ...]

    const partOf = (ch) => {
      const id = trackIndex + ":" + ch;
      if (!parts.has(id)) {
        parts.set(id, { id, trackIndex, channel: ch, program: null, notes: [], mods: [] });
      }
      return parts.get(id);
    };

    const openNote = (ch, key, vel, tick) => {
      const k = ch + ":" + key;
      if (!holding.has(k)) holding.set(k, []);
      holding.get(k).push({ key, velocity: vel, startTick: tick, endTick: tick, ch });
    };

    const closeNote = (ch, key, tick) => {
      const k = ch + ":" + key;
      const stack = holding.get(k);
      if (!stack || !stack.length) return;
      const note = stack.pop();          // 겹친 같은 음은 최근 것부터 닫는다
      note.endTick = Math.max(note.startTick, tick);
      partOf(ch).notes.push(note);
      if (!stack.length) holding.delete(k);
    };

    for (const ev of events) {
      endTick = Math.max(endTick, ev.tick);
      if (ev.type === "tempo") { tempos.push({ tick: ev.tick, bpm: ev.bpm }); continue; }
      if (ev.type === "program") { const p = partOf(ev.ch); if (p.program === null) p.program = ev.program; continue; }
      if (ev.type === "mod") { partOf(ev.ch).mods.push({ tick: ev.tick, value: ev.value }); continue; }
      if (ev.type === "on")  { openNote(ev.ch, ev.key, ev.vel, ev.tick); continue; }
      if (ev.type === "off") { closeNote(ev.ch, ev.key, ev.tick); continue; }
    }

    // 닫히지 않은 음은 트랙 끝에서 닫는다
    for (const [k, stack] of holding) {
      const ch = Number(k.split(":")[0]);
      for (const note of stack) {
        note.endTick = Math.max(note.startTick, endTick);
        partOf(ch).notes.push(note);
      }
    }
  });

  return {
    parts: [...parts.values()].filter(p => p.notes.length > 0),
    tempos,
    endTick
  };
}

/* 같은 tick의 템포는 마지막 값만, 값이 안 바뀌면 버린다 */
function normalizeTempos(raw, ppq) {
  const byTick = new Map();
  for (const t of raw) byTick.set(t.tick, t.bpm);
  const sorted = [...byTick.entries()].sort((a, b) => a[0] - b[0]);

  const out = [];
  let last = null;
  if (!sorted.length || sorted[0][0] > 0) { out.push({ pos: 0, bpm: INITIAL_TEMPO }); last = INITIAL_TEMPO; }
  for (const [tick, bpm] of sorted) {
    if (bpm === last) continue;
    out.push({ pos: snap(toTick(tick, ppq)), bpm });
    last = bpm;
  }
  // 스냅 후 같은 자리에 몰린 템포는 마지막 것만
  const merged = [];
  for (const t of out) {
    if (merged.length && merged[merged.length - 1].pos === t.pos) merged[merged.length - 1] = t;
    else merged.push(t);
  }
  return merged;
}

/* ============================================================
   MML 이벤트 생성
   ============================================================
   박자 밀림을 막는 규칙 두 가지.

   1) 커서는 "실제로 찍힌 길이"로만 전진한다.
      ticksToMml이 돌려주는 tick이 요청 길이와 다를 수 있는데,
      그 차이를 무시하면 트랙 전체가 조금씩 뒤로 밀린다.

   2) 쉼표 길이는 항상 절대 위치에서 다시 계산한다.
      앞에서 오차가 생겨도 다음 음에서 바로 흡수되므로 누적되지 않는다.

   또 MIN_TICK(1/64음표)보다 가깝게 붙은 음은 하나의 화음으로 합친다.
   예전 코드가 이런 음에 억지로 최소 길이를 주면서 커서를 앞질러
   그 뒤 전체가 밀리던 문제를 여기서 없앤다.
   ============================================================ */
function buildEvents(part, tempos, ppq) {
  const notes = part.notes.map(n => ({
    key: n.key,
    pitch: keyToPitchClass(n.key),
    octave: keyToOctave(n.key),
    velocity: velocityToMml(n.velocity),
    start: snap(toTick(n.startTick, ppq)),
    end:   snap(toTick(n.endTick, ppq))
  })).sort((a, b) => (a.start - b.start) || (a.key - b.key));

  // 같은 시작점(또는 1/64음표보다 가까운 시작점) = 한 화음
  const groups = [];
  for (const n of notes) {
    const last = groups[groups.length - 1];
    if (last && n.start - last.start < MIN_TICK) {
      if (!last.notes.some(x => x.key === n.key)) last.notes.push(n);  // 같은 음 중복 제거
    } else {
      groups.push({ start: n.start, notes: [n] });
    }
  }

  // 그룹 길이 결정 + 다음 그룹 시작점까지로 클램프
  groups.forEach((g, idx) => {
    const durations = g.notes.map(n => Math.max(0, n.end - g.start));
    let dur;
    if (CHORD_DURATION_MODE === "max") dur = Math.max(...durations);
    else if (CHORD_DURATION_MODE === "first") dur = durations[0];
    else dur = Math.min(...durations);

    const next = groups[idx + 1];
    const slot = next ? next.start - g.start : dur;   // 그룹 간격은 항상 MIN_TICK 이상
    g.techniques = [];

    /* 스타카토
       "짧은 음 + 쉼표" 대신 "자리를 다 채운 음 + *13"으로 적는다.
       어느 쪽이든 다음 음이 시작하는 위치는 같으므로 박자는 그대로다. */
    if (AUTO_TECHNIQUE && next && slot >= MIN_TICK * 2 && dur <= slot * STACCATO_RATIO) {
      g.techniques.push(TECHNIQUE.staccato);
      g.duration = slot;
    } else {
      g.duration = Math.max(MIN_TICK, Math.min(dur, slot));
    }
  });

  /* 악센트 — 주변 평균보다 뚜렷하게 센 음.
     *14가 강조를 담당하므로 v는 주변 수준으로 되돌린다.
     그러지 않으면 v 상승과 악센트가 겹쳐 그 음만 튄다. */
  if (AUTO_TECHNIQUE) {
    const vel = groups.map(g => Math.max(...g.notes.map(n => n.velocity)));
    groups.forEach((g, idx) => {
      const from = Math.max(0, idx - ACCENT_WINDOW);
      const to   = Math.min(vel.length, idx + ACCENT_WINDOW + 1);
      let sum = 0, count = 0;
      for (let i = from; i < to; i++) { if (i === idx) continue; sum += vel[i]; count++; }
      if (!count) return;
      const avg = sum / count;
      if (vel[idx] >= avg + ACCENT_DELTA) {
        g.techniques.push(TECHNIQUE.accent);
        if (ACCENT_MODE === "replace") {
          g.velocity = Math.max(VEL_MIN, Math.min(VEL_MAX, Math.round(avg)));
        }
      }
    });
  }

  /* 비브라토 — 모듈레이션(CC1)이 걸려 있는 구간 */
  if (AUTO_TECHNIQUE && part.mods && part.mods.length) {
    const mods = part.mods
      .map(m => ({ pos: snap(toTick(m.tick, ppq)), value: m.value }))
      .sort((a, b) => a.pos - b.pos);
    let mi = 0, current = 0;
    for (const g of groups) {
      while (mi < mods.length && mods[mi].pos <= g.start) current = mods[mi++].value;
      if (current >= VIBRATO_CC_MIN) g.techniques.push(TECHNIQUE.vibrato);
    }
  }

  // 템포 + 화음을 한 타임라인으로
  const timeline = [
    ...tempos.map(t => ({ pos: t.pos, order: 0, tempo: t.bpm })),
    ...groups.map(g => ({ pos: g.start, order: 1, group: g }))
  ].sort((a, b) => (a.pos - b.pos) || (a.order - b.order));

  const events = [];
  let cursor = 0, lastOctave = null, lastVelocity = null, lastTempo = null;

  for (const item of timeline) {
    // 절대 위치 기준으로 쉼표를 채운다. 앞선 오차는 여기서 흡수된다.
    if (item.pos > cursor) {
      const rest = ticksToMml(REST, item.pos - cursor, false);   // 쉼표는 &로 잇지 않는다
      if (rest.tick > 0) {
        events.push({ type: "Rest", tick: rest.tick, text: rest.text });
        cursor += rest.tick;
      }
    }

    if (item.group === undefined) {
      // 음표 중간에 걸린 템포는 가장 가까운 다음 경계로 밀린다
      if (item.tempo !== lastTempo) {
        events.push({ type: "Tempo", tempo: item.tempo });
        lastTempo = item.tempo;
      }
      continue;
    }

    const g = item.group;
    // velocity는 화음 단위로 한 번만 (Armis 화음 안에는 o만 넣는다)
    const vel = g.velocity !== undefined ? g.velocity : Math.max(...g.notes.map(n => n.velocity));
    if (vel !== lastVelocity) {
      events.push({ type: "Velocity", value: vel });
      lastVelocity = vel;
    }

    // 기법은 화음 전체에 한 번씩만 붙인다
    const pre  = (g.techniques || []).filter(t => t.place === "pre").map(t => t.code).join("");
    const post = (g.techniques || []).filter(t => t.place === "post").map(t => t.code).join("");

    // 화음 구성음은 모두 같은 문자열 길이를 쓰므로 한 번만 계산한다
    let played = 0;
    g.notes.forEach((n, idx) => {
      if (idx > 0) events.push({ type: "ConnectChord" });
      if (n.octave !== lastOctave) {
        events.push({ type: "Octave", value: n.octave });
        lastOctave = n.octave;
      }
      if (idx === 0 && pre) events.push({ type: "Technique", text: pre });   // [N]은 음표 앞
      const note = ticksToMml(n.pitch, g.duration, true);
      played = note.tick;                       // 실제로 찍힌 길이
      events.push({ type: "Note", tick: note.tick, text: note.text });
    });
    if (post) events.push({ type: "Technique", text: post });                // *N은 음표 뒤

    cursor += played;   // 요청 길이가 아니라 찍힌 길이로 전진
  }

  return events;
}

function eventToMml(e) {
  switch (e.type) {
    case "ConnectChord": return ":";
    case "Tempo":        return "t" + e.tempo;
    case "Octave":       return "o" + e.value;
    case "Velocity":     return "v" + e.value;
    case "Technique":    return e.text;
    case "Rest":         return e.text;
    case "Note":         return e.text;
    default:             return "";
  }
}

/* ============================================================
   트랙 / 곡
   ============================================================ */
function instrumentName(part) {
  if (part.channel === 9) return "Drum Set";
  const id = part.program === null ? 0 : part.program;
  return INSTRUMENT_MAP[id] || INSTRUMENT_MAP[0];
}

function convert(buffer) {
  const smf = parseSMF(buffer);
  const { parts, tempos } = collectParts(smf);
  const tempoList = normalizeTempos(tempos, smf.ppq);

  const tracks = parts.map(part => {
    const events = buildEvents(part, tempoList, smf.ppq);
    return {
      label: "T" + part.trackIndex + " · ch" + part.channel,
      instrument: instrumentName(part),
      channel: part.channel,
      noteCount: part.notes.length,
      events
    };
  }).filter(t => t.events.some(e => e.type === "Note"));

  if (AUTO_BOOT_VELOCITY && tracks.length) {
    let vmax = 0;
    for (const t of tracks) for (const e of t.events) if (e.type === "Velocity") vmax = Math.max(vmax, e.value);
    const diff = VEL_MAX - vmax;
    if (diff > 0) {
      for (const t of tracks) for (const e of t.events) if (e.type === "Velocity") e.value += diff;
    }
  }

  for (const t of tracks) {
    t.mml = t.events.map(eventToMml).join("");
    // 화음 구성음은 시간이 겹치므로 한 번만 센다
    let total = 0, inChord = false;
    for (const e of t.events) {
      if (e.type === "ConnectChord") { inChord = true; continue; }
      if (e.type === "Note") { if (!inChord) total += e.tick; inChord = false; continue; }
      if (e.type === "Rest") { total += e.tick; inChord = false; }
    }
    t.totalTick = total;
  }
  return { ppq: smf.ppq, format: smf.format, tracks, tempoList };
}

/* ==== UI ==== */
const $ = s => document.querySelector(s);
const fileEl = $("#file"), tracksEl = $("#tracks"), ppqEl = $("#ppq");
const loadingEl = $("#loading"), errEl = $("#err"), warnEl = $("#warning");
const quantizeEl = $("#quantize"), techniqueEl = $("#technique");
let currentSong = null, currentBuffer = null;

function render(song) {
  ppqEl.textContent = "PPQ " + song.ppq + " · format " + song.format + " · 트랙 " + song.tracks.length + "개";

  const notes = [];
  if (QUANTIZE_MODE === "binary") {
    notes.push("2분할 격자(1/32)로만 맞춥니다. 셋잇단음표는 어긋납니다.");
  } else if (QUANTIZE_MODE === "none") {
    notes.push("양자화를 끈 상태입니다. 원본 연주의 흔들림이 그대로 남습니다.");
  } else {
    notes.push("1/32음표와 16분 셋잇단 중 가까운 쪽으로 맞춥니다.");
  }
  notes.push("내부 해상도 " + TPQN + " tick/4분음표 · 최소 단위 1/" + (WHOLE / MIN_TICK) + "음표 · 음량 v" + VEL_MIN + "~v" + VEL_MAX);
  if (AUTO_TECHNIQUE) {
    notes.push("자동 기법: 스타카토(*13), 악센트(*14), 비브라토([1], CC1 기준). 상/하/페르마타는 수동으로 넣어야 합니다.");
  }
  warnEl.textContent = notes.join("\n");

  if (!song.tracks.length) {
    tracksEl.innerHTML = '<p class="empty">음표가 있는 트랙을 찾지 못했습니다.</p>';
    return;
  }

  tracksEl.innerHTML = "";
  for (const t of song.tracks) {
    const card = document.createElement("div"); card.className = "track";
    const row = document.createElement("div"); row.className = "row";

    const left = document.createElement("div"); left.className = "left";

    // MIDI에 적힌 악기
    const badge = document.createElement("span"); badge.className = "badge";
    badge.textContent = t.label + " · " + t.instrument;

    // 게임에서 쓸 악기 (선택만 하고 아직 변환에는 쓰지 않는다)
    const arrow = document.createElement("span"); arrow.className = "arrow";
    arrow.textContent = "→";
    const pick = document.createElement("select"); pick.className = "inst";
    pick.setAttribute("aria-label", t.label + " 악기 선택");
    for (const name of ARMIS_INSTRUMENTS) {
      const op = document.createElement("option");
      op.value = name; op.textContent = name;
      pick.appendChild(op);
    }
    if (!t.armis) t.armis = ARMIS_INSTRUMENTS[0];
    pick.value = t.armis;
    pick.onchange = () => { t.armis = pick.value; };

    const meta = document.createElement("span"); meta.className = "meta";
    const bars = (t.totalTick / WHOLE).toFixed(1);
    meta.textContent = "음표 " + t.noteCount + "개, " + t.mml.length + "자, 약 " + bars + "마디";
    left.append(badge, arrow, pick, meta);

    const copy = document.createElement("button"); copy.className = "copy"; copy.textContent = "복사";
    copy.onclick = async () => {
      try {
        await navigator.clipboard.writeText(t.mml);
        copy.textContent = "복사함";
      } catch { copy.textContent = "복사 실패"; }
      setTimeout(() => { copy.textContent = "복사"; }, 1200);
    };

    row.append(left, copy);

    const ta = document.createElement("textarea");
    ta.value = t.mml; ta.spellcheck = false;
    ta.setAttribute("aria-label", t.label + " MML");

    card.append(row, ta);
    tracksEl.appendChild(card);
  }
}

function run() {
  errEl.textContent = ""; warnEl.textContent = "";
  if (!currentBuffer) return;
  loadingEl.style.display = "inline";
  try {
    currentSong = convert(currentBuffer);
  } catch (e) {
    console.error(e);
    errEl.textContent = "변환 실패: " + (e && e.message ? e.message : String(e));
    tracksEl.innerHTML = '<p class="empty">변환하지 못했습니다.</p>';
    loadingEl.style.display = "none";
    return;
  }
  // 화면 표시가 실패해도 변환 결과 자체는 살려 둔다
  try {
    render(currentSong);
  } catch (e) {
    console.error(e);
    errEl.textContent = "결과 표시 중 오류: " + (e && e.message ? e.message : String(e));
  } finally {
    loadingEl.style.display = "none";
  }
}

fileEl.addEventListener("change", async ev => {
  errEl.textContent = ""; warnEl.textContent = ""; ppqEl.textContent = "";
  tracksEl.innerHTML = ""; currentSong = null; currentBuffer = null;

  const file = ev.target.files && ev.target.files[0];
  if (!file) { tracksEl.innerHTML = '<p class="empty">아직 변환한 파일이 없습니다.</p>'; return; }

  try {
    currentBuffer = await file.arrayBuffer();
  } catch (e) {
    errEl.textContent = "파일을 읽지 못했습니다.";
    return;
  }
  run();
});

quantizeEl.addEventListener("change", () => {
  QUANTIZE_MODE = quantizeEl.value;
  run();
});

techniqueEl.addEventListener("change", () => {
  AUTO_TECHNIQUE = techniqueEl.checked;
  run();
});

function allText() {
  if (!currentSong) return "";
  return currentSong.tracks.map(function (t) {
    return "; " + t.label + " — " + t.instrument + "\n" + t.mml;
  }).join("\n\n");
}

$("#copyAll").onclick = async () => {
  const btn = $("#copyAll");
  if (!currentSong) { btn.textContent = "먼저 파일을 올려주세요"; setTimeout(() => btn.textContent = "전체 복사", 1500); return; }
  try { await navigator.clipboard.writeText(allText()); btn.textContent = "복사함"; }
  catch { btn.textContent = "복사 실패"; }
  setTimeout(() => btn.textContent = "전체 복사", 1200);
};

$("#download").onclick = () => {
  const btn = $("#download");
  if (!currentSong) { btn.textContent = "먼저 파일을 올려주세요"; setTimeout(() => btn.textContent = ".txt로 저장", 1500); return; }
  const blob = new Blob([allText()], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "armis-mml.txt";
  a.click();
  URL.revokeObjectURL(a.href);
};
</script>
</body>
</html>
